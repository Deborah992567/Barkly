datasets:
  - dataset_id: barkopedia-activity-env
    name: Barkopedia Dog Activity & Environment
    source_url: https://huggingface.co/datasets/ArlingtonCL2/Barkopedia_Dog_Act_Env
    authors: UT Arlington ACL2 Lab
    publication: IJCAI 2025
    version: "1.0"
    access_date: "2026-09-10"
    license: MIT
    modality: audio
    task: behavioral_context_classification
    labels:
      - rest
      - alerting_to_sounds
      - seeking_attention
      - playing_with_human
      - playing_with_other_animals
      - playing_with_toy
      - begging_for_food
      - taking_shower
    sample_count: 12480
    advertised_sample_count: 12480
    verified_raw_files: 12480
    verified_labeled_samples: 12480
    verified_split_samples: 12478
    class_distribution_verified:
      seeking_attention: 1818
      playing_with_human: 1797
      playing_with_toy: 1779
      playing_with_other_animals: 1774
      rest: 1770
      alerting_to_sounds: 1754
      taking_shower: 1245
      begging_for_food: 541
    dog_identity_available: false
    split_method: random (no dog identity available)
    preprocessing_version: "0.1.0"
    permitted_use: commercial, research, redistribution
    restrictions: none
    known_limitations:
      - Labels initially generated by VLM then manually verified
      - No vocalization type labels
      - Activity context not equivalent to emotional state
      - 50% clips under 1s and 87% under 3s (fixed 3s window mostly padding)
      - 21 raw label strings collapse to 8 classes (case inconsistency)
      - env column misspelled 'environement' (sic)
    citation: "Barkopedia: A Canine Vocalization Understanding Challenge, IJCAI 2025"
    validation_report: "../docs/dataset-validation-report.md"

  - dataset_id: dogpose-cv
    name: DogPoseCV
    source_url: https://huggingface.co/datasets/stockeh/dog-pose-cv
    authors: Jason Stock, Tom Cavey
    publication: arXiv:2101.02380
    version: "1.0"
    access_date: "2026-09-10"
    license: Apache-2.0
    modality: vision
    task: pose_classification
    labels:
      - standing
      - sitting
      - lying_down
      - undefined
    sample_count: 20578
    advertised_sample_count: 20578
    verified_raw_files: 20730
    verified_labeled_samples: 20423
    verified_split_samples: 20197
    class_distribution_verified:
      standing: 6983
      undefined: 6190
      sitting: 2969
      lying: 4055
    dog_identity_available: false
    split_method: random (no dog identity available)
    preprocessing_version: "0.1.0"
    permitted_use: commercial, research, redistribution
    restrictions: none
    known_limitations:
      - Class imbalance (standing 2.4x sitting; undefined class 30%)
      - README class distribution does NOT match shipped label CSVs (verified; CSVs are source of truth)
      - Shipped validation/ dir (150 files) is unlabeled; pipeline drops it
      - 139 validation files byte-identical to labeled breed files
      - Pose labels not behavioral states
      - No dog identity - near-duplicate leakage possible across breeds
    citation: "Stock and Cavey, Who's a Good Boy? Reinforcing Canine Behavior in Real-Time using Machine Learning, arXiv:2101.02380, 2021"
    validation_report: "../docs/dataset-validation-report.md"

  - dataset_id: barkopedia-emotion
    name: Barkopedia Dog Emotion Classification
    source_url: https://huggingface.co/datasets/ArlingtonCL2/BarkopediaDogEmotionClassification_Data
    authors: UT Arlington ACL2 Lab
    publication: IJCAI 2025
    version: "1.0"
    access_date: "2026-09-10"
    license: MIT
    modality: audio
    task: arousal_valence_classification
    labels:
      - arousal_low
      - arousal_medium
      - arousal_high
      - valence_negative
      - valence_neutral
      - valence_positive
    sample_count: 1400
    dog_identity_available: false
    split_method: provided (train/test)
    preprocessing_version: "0.1.0"
    permitted_use: commercial, research, redistribution
    restrictions: none
    known_limitations:
      - Very small (1400 clips)
      - Only 2 breeds (Husky, Shiba Inu)
      - Arousal/valence are subjective interpretations
    citation: "Dang et al., EmotionalCanines: A Dataset for Analysis of Arousal and Valence in Dog Vocalization, ACM MM 2025"

  - dataset_id: dog-emotion-v2
    name: Dog Emotion Dataset v2
    source_url: https://huggingface.co/datasets/Dewa/Dog_Emotion_Dataset_v2
    authors: Dewa
    publication: Kaggle
    version: "2.0"
    access_date: "2026-09-10"
    license: creativeml-openrail-m
    modality: vision
    task: emotion_classification
    labels:
      - sad
      - angry
      - relaxed
      - happy
    sample_count: 4000
    dog_identity_available: false
    split_method: provided (train/test)
    preprocessing_version: "0.1.0"
    permitted_use: research, commercial with restrictions
    restrictions: OpenRAIL-M - must not be used for harm
    known_limitations:
      - Small dataset
      - Subjective emotion labels
      - Emotion labels are interpretations not observable signals
    citation: "Based on Kaggle dataset"

  - dataset_id: dogspeak
    name: DogSpeak
    source_url: https://huggingface.co/datasets/ArlingtonCL2/DogSpeak_Dataset
    authors: Lekhak, Wang, Dang, Zhu
    publication: ACM MM 2025
    version: "1.0"
    access_date: "2026-09-10"
    license: CC BY-NC-SA 4.0
    modality: audio
    task: breed_sex_classification
    labels:
      - breed
      - sex
      - dog_id
    sample_count: 77202
    dog_identity_available: true
    split_method: dog-level (dog_id available)
    preprocessing_version: "0.1.0"
    permitted_use: research only, non-commercial
    restrictions: "Non-commercial use only, share-alike required"
    known_limitations:
      - No vocalization type labels
      - Only 5 breeds
      - Non-commercial license
      - Not suitable for BARKLY vocalization classification
    citation: "Lekhak et al., DogSpeak: A Canine Vocalization Classification Dataset, ACM MM 2025"
    status: rejected_for_barkly
    rejection_reason: "Labels (breed/sex) do not match BARKLY vocalization taxonomy, non-commercial license"
