[project]
name = "barkly-backend"
version = "0.1.0"
description = "BARKLY API backend - AI-enabled dog behavior interpretation foundation."
requires-python = ">=3.11"
dependencies = [
    "fastapi~=0.115",
    "uvicorn[standard]~=0.34",
    "sqlalchemy[asyncio]~=2.0",
    "alembic~=1.14",
    "aiosqlite~=0.20",
    "aiomysql~=0.2",
    "PyMySQL~=1.1",
    "pydantic~=2.10",
    "pydantic-settings~=2.7",
    "PyJWT~=2.10",
    "bcrypt~=4.2",
    "python-multipart~=0.0.9",
    "email-validator~=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3",
    "pytest-asyncio~=0.25",
    "httpx~=0.28",
    "ruff~=0.9",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:'asyncio.get_event_loop_policy' is deprecated:DeprecationWarning",
    "ignore:'asyncio.set_event_loop_policy' is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"migrations/**" = ["E501", "W291"]